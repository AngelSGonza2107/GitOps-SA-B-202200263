apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-p8-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AngelSGonza2107/GitOps-SA-B-202200263.git
    targetRevision: main
    path: environments/prod/rendered
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
