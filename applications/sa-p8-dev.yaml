apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-p8-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AngelSGonza2107/GitOps-SA-B-202200263.git
    targetRevision: main
    path: environments/dev/rendered
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
