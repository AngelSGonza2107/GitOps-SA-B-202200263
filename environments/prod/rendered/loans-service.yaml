apiVersion: v1
kind: ConfigMap
metadata:
  name: loans-service-canary-test
  labels:
    helm.sh/chart: loans-service-2.0.0
    app.kubernetes.io/name: loans-service
    app.kubernetes.io/instance: loans-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: sa-platform
    sa-platform.io/component: "loans"
data:
  canary.js: |
    import http from "k6/http";
    import { check, sleep } from "k6";

    http.setResponseCallback(http.expectedStatuses(200, 401));
    export const options = {
      vus: 3,
      duration: "15s",
      thresholds: {
        http_req_failed: ["rate<0.01"],
        http_req_duration: ["p(95)<750"],
        checks: ["rate>0.99"]
      }
    };

    const targets = [
      { path: "/live", status: 200 },
      { path: "/ready", status: 200 },
      { path: "/health", status: 200 },
    ];

    export default function () {
      for (const target of targets) {
        const response = http.get(`${__ENV.BASE_URL}${target.path}`, {
          timeout: "3s",
          tags: { endpoint: target.path }
        });
        check(response, {
          [`${target.path} devuelve ${target.status}`]: (result) => result.status === target.status
        });
      }
      sleep(0.2);
    }

