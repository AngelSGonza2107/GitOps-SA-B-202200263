    app.kubernetes.io/part-of: sa-platform
    sa-platform.io/component: "gateway"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: api-gateway
  strategy:
    canary:
      stableService: api-gateway-stable
      canaryService: api-gateway-canary
      maxSurge: 1
      maxUnavailable: 0
      abortScaleDownDelaySeconds: 30
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: api-gateway-quality-gate
        - setWeight: 50
        - analysis:
            templates:
              - templateName: api-gateway-quality-gate
        - setWeight: 80
        - analysis:
            templates:
              - templateName: api-gateway-quality-gate
  template:
    metadata:
