apiVersion: batch/v1
kind: CronJob
metadata:
  name: insert-execution
  namespace: sa-p8-dev
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: sa-platform
    sa-platform.io/component: insert-execution
spec:
  schedule: "*/2 * * * *"
  timeZone: America/Guatemala
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: sa-platform
            sa-platform.io/component: insert-execution
            sa-platform.io/database-access: "true"
            sa-platform.io/broker-access: "false"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: insert-execution
              image: "us-central1-docker.pkg.dev/practicas-sa-2s2026/sa-platform-prod/jobs:v0.0.0-bootstrap.1"
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "jobs.insert_execution"]
              envFrom:
                - configMapRef: { name: sa-cronjobs-config }
                - secretRef: { name: sa-cron-insert-credentials }
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                limits:
                  cpu: 200m
                  memory: 192Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: { sizeLimit: 32Mi }
