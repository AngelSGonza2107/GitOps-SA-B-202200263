              - templateName: api-gateway-quality-gate
            args:
              - name: service-name
                value: "api-gateway"
              - name: candidate-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 80
        - analysis:
            templates:
              - templateName: api-gateway-quality-gate
            args:
              - name: service-name
                value: "api-gateway"
              - name: candidate-hash
                valueFrom:
                  podTemplateHashValue: Latest
  template:
    metadata:
      annotations:
        checksum/config: "ea4e1fb81a2c67ec1ee1a67ee0e20821a978b0ba2c14ce053db8d9de214f2ea4"
      labels:
