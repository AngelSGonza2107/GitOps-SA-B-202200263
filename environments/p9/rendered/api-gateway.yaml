apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-gateway-quality-gate
  labels:
    helm.sh/chart: api-gateway-2.0.0
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: api-gateway
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: sa-platform
    sa-platform.io/component: "gateway"
spec:
  args:
    - name: service-name
    - name: candidate-hash
  metrics:
    - name: candidate-error-rate
      initialDelay: 30s
      interval: 20s
      count: 3
      failureLimit: 1
      successCondition: "len(result) == 1 && !isNaN(result[0]) && result[0] <= 0.05"
      provider:
        prometheus:
          address: "http://monitoring-kube-prometheus-prometheus.observability.svc.cluster.local:9090"
          query: |
            (
              (sum(rate(sa_http_server_requests_total{
                service_name="{{args.service-name}}",
                rollout_hash="{{args.candidate-hash}}",
                http_route!~"/(live|ready|health)",
                http_response_status_code=~"5.."
              }[1m])) or vector(0))
              /
              clamp_min(
                (sum(rate(sa_http_server_requests_total{
                  service_name="{{args.service-name}}",
                  rollout_hash="{{args.candidate-hash}}",
                  http_route!~"/(live|ready|health)"
                }[1m])) or vector(0)),
                0.001
              )
            )
    - name: candidate-p95-latency
      initialDelay: 30s
      interval: 20s
      count: 3
      failureLimit: 1
      successCondition: "len(result) == 1 && !isNaN(result[0]) && result[0] <= 0.75"
      provider:
        prometheus:
          address: "http://monitoring-kube-prometheus-prometheus.observability.svc.cluster.local:9090"
          query: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(sa_http_server_duration_seconds_bucket{
                  service_name="{{args.service-name}}",
                  rollout_hash="{{args.candidate-hash}}",
                  http_route!~"/(live|ready|health)"
                }[1m])
              )
            )

