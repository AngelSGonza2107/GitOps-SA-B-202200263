                    app.kubernetes.io/instance: api-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: "us-central1-docker.pkg.dev/practicas-sa-2s2026/sa-platform-prod/api-gateway:v8.0.9"
