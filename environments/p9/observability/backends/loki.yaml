apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: sa-observability}
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      retention_period: 48h
      volume_enabled: true
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: sa-observability}
spec:
  selector: {app.kubernetes.io/name: loki}
  ports:
    - {name: http, port: 3100, targetPort: http}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: sa-observability}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: sa-observability}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: loki}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: sa-observability}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: loki
          image: grafana/loki:3.7.8
          args: [-config.file=/etc/loki/loki.yaml]
          ports:
            - {name: http, containerPort: 3100}
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 30, periodSeconds: 15}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/loki, readOnly: true}
            - {name: data, mountPath: /var/loki}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          persistentVolumeClaim: {claimName: loki-data}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
