apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/part-of: sa-observability}
data:
  tempo.yaml: |
    multitenancy_enabled: false
    usage_report:
      reporting_enabled: false
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 48h
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/part-of: sa-observability}
spec:
  selector: {app.kubernetes.io/name: tempo}
  ports:
    - {name: http, port: 3200, targetPort: http}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
  labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/part-of: sa-observability}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/part-of: sa-observability}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: tempo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/part-of: sa-observability}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: tempo
          image: grafana/tempo:2.10.8
          args: [-config.file=/etc/tempo/tempo.yaml]
          ports:
            - {name: http, containerPort: 3200}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 30, periodSeconds: 15}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo, readOnly: true}
            - {name: data, mountPath: /var/tempo}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: tempo-config}
        - name: data
          persistentVolumeClaim: {claimName: tempo-data}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
