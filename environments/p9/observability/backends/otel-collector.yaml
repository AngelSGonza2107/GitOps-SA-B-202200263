apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  labels: {app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: sa-observability}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sa-p10-otel-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sa-p10-otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sa-p10-otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels: {app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: sa-observability}
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      filelog:
        include:
          - /var/log/pods/sa-p9_*/*/*.log
        exclude:
          - /var/log/pods/observability_*/*/*.log
        include_file_path: true
        start_at: beginning
        operators:
          - id: container-parser
            type: container
    processors:
      memory_limiter:
        check_interval: 2s
        limit_mib: 384
        spike_limit_mib: 96
      k8sattributes:
        auth_type: serviceAccount
        filter:
          node_from_env_var: K8S_NODE_NAME
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.container.name
            - k8s.node.name
          labels:
            - tag_name: rollout_hash
              key: rollouts-pod-template-hash
              from: pod
            - tag_name: service.name
              key: app.kubernetes.io/name
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
          - sources:
              - from: connection
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: ""
        resource_to_telemetry_conversion:
          enabled: true
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        tls:
          insecure: true
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [prometheus]
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/loki]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels: {app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: sa-observability}
spec:
  selector: {app.kubernetes.io/name: otel-collector}
  internalTrafficPolicy: Local
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: prometheus, port: 8889, targetPort: prometheus}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  labels: {app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: sa-observability}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: otel-collector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: sa-observability}
    spec:
      serviceAccountName: otel-collector
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: collector
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0
          args: [--config=/etc/otel/collector.yaml]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: prometheus, containerPort: 8889}
            - {name: health, containerPort: 13133}
          readinessProbe: {httpGet: {path: /, port: health}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: health}, initialDelaySeconds: 15, periodSeconds: 15}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 75m, memory: 192Mi}
            limits: {cpu: 400m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/otel, readOnly: true}
            - {name: varlogpods, mountPath: /var/log/pods, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
        - name: varlogpods
          hostPath: {path: /var/log/pods, type: Directory}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
